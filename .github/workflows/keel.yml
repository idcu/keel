name: keel（项目仓）

# 规格仓的 CI：守"文档与脚本不许漂移"这条不变量。
# 发布仓 keel-starter 另有自己的 workflow（lint + 自测），不依赖子模块。

on:
  push:
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      # 故意**不**在 checkout 里取子模块：见下面那一步
      - uses: actions/checkout@v4

      # 镜像同步是无序的（《Keel 设计稿》§12.3 实测）：Gitee→GitHub 的自动同步不保证两仓先后，
      # 发布仓平均比项目仓晚 3–4 分钟。于是"项目仓指针指向发布仓新提交"的窗口里，
      # GitHub 上的发布仓还没有那个提交，直接取子模块会失败：
      #   remote error: upload-pack: not our ref <sha>
      # 所以这里带退避重试（10 × 30s ≈ 5 分钟上限，覆盖实测延迟）。
      # 注意：这个限制管不到人工推送——scripts/release.sh 已经强制了正确顺序。
      - name: 检出子模块（对镜像延迟重试）
        run: |
          want=$(git rev-parse HEAD:keel-starter)
          echo "项目仓期望的子模块提交: $want"
          for i in $(seq 1 10); do
            if git submodule update --init --recursive; then
              echo "✅ 子模块就绪（第 $i 次尝试）"
              exit 0
            fi
            echo "⚠️  第 $i 次失败 —— 发布仓镜像可能还没同步到 $want，30s 后重试"
            rm -rf keel-starter .git/modules/keel-starter   # 清掉半成品，避免污染下次重试
            sleep 30
          done
          echo "❌ 子模块连续 10 次取不到（约 5 分钟）——发布仓镜像未同步或该提交不存在"
          exit 1

      - name: 自测 + 规格一致性（在规格仓里 DOC 检查才真正生效）
        run: bash keel-starter/keel/checks/test-lint.sh

      - name: 发布仓模板自身过一遍 lint
        run: bash keel-starter/keel/checks/keel-lint.sh keel-starter/keel

      # 本仓的 keel/ 实例（Keel 项目自己的上下文基座，v3.2 起）
      # 为什么要单独一步：模板 lint 绿 ≠ 本项目上下文合规。
      # 实例记的是本项目自己的 NOW / 坑 / ADR，模板记的是别人的——两者互不覆盖。
      # 这一步缺失的后果是"规则要求别人做而自己不做"，而 lint 不会主动报这个。
      - name: 本仓 keel/ 实例过一遍 lint
        run: bash keel/checks/keel-lint.sh keel

      # 实例的锚点必须与 §4.1 原文一致（实例自带的 AGENTS.md 不能被删/改写）
      - name: 点火锚点在位
        run: |
          grep -qF '任何任务开始前，先读 keel/INDEX.md 与其中指向的 NOW.md，并遵守 INDEX.md 里的检索协议。' AGENTS.md \
            || { echo "❌ AGENTS.md 缺 §4.1 原文锚点"; exit 1; }
          echo "✅ 点火锚点在位"

      # 钩子"验谎"：CI 是新 clone，天然没装 core.hooksPath，所以只验本体存在 + 可执行
      - name: 闭环钩子本体
        run: bash keel-starter/keel/checks/verify-hooks.sh keel-starter --allow-unset

      # 可选能力"不落空"：MCP 服务本身能跑；项目根若声明了外部 MCP server，也要可达
      - name: MCP 只读服务自测
        run: python3 keel-starter/keel/checks/mcp/keel-mcp-server.py --self-test

      - name: 检索增强接入位（未声明即正常，恒 exit 0）
        run: bash keel-starter/keel/checks/check-mcp-config.sh .

      # scripts/release.sh 只存在于本仓（发布仓没有它），发布仓 CI 覆盖不到 —— 这里补上
      - name: 发布脚本自检（语法 / 参数契约 / dry-run）
        run: |
          bash -n scripts/release.sh
          rc=0; bash scripts/release.sh --bogus || rc=$?
          if [ "$rc" -ne 2 ]; then echo "未知参数应返回退出码 2，实际 $rc"; exit 1; fi
          bash scripts/release.sh
